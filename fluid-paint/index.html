<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Fluid Paint</title>

        <meta name="description" content="Fluid paint simulation">

        <link href='http://fonts.googleapis.com/css?family=Open+Sans:400,300,600,700,800' rel='stylesheet' type='text/css'>
        <link rel="stylesheet" href="paint.css">
    </head>

    <body>
        <script type="text/template" id="main">
            <div id="ui">
                <div id="clear-button" class="button">전부 지우기</div><div id="save-button" class="button">그림 저장</div>

                <div class="control-label">물감 색</div>
                <div class="control-hint">사각형은 색, 가운데 띠는 색상, 오른쪽 띠는 물감 양</div>
                <!-- 색 고르개는 WebGL 로 이 자리에 그린다. 높이만큼 자리를 비워 둔다. -->
                <div id="color-wheel-space"></div>

                <div class="control-label">쓰던 색</div>
                <div id="recent-colors" class="swatches"></div>

                <div class="control-label">유화 물감</div>
                <div id="palette" class="swatches"></div>

                <div class="control-label">화질</div>
                <div class="buttons" id="qualities"></div>
                <div style="clear:both"></div>

                <div class="control-label">색 섞는 방식</div>
                <div class="control-hint">물감: 파랑+노랑=초록 · 디지털: 화면 빛의 규칙</div>
                <div class="buttons" id="models"></div>
                <div style="clear:both"></div>

                <div class="control-label">물감 묽기</div>
                <div class="control-hint">오른쪽일수록 묽어서 잘 번진다</div>
                <div id="fluidity-slider" class="slider"></div>

                <div class="control-label">붓털 개수</div>
                <div class="control-hint">적으면 성글고 거칠다</div>
                <div id="bristles-slider" class="slider"></div>

                <div class="control-label">붓 크기</div>
                <div class="control-hint">휠을 굴려도 바뀐다</div>
                <div id="size-slider" class="slider"></div>

                <!-- [atelier] 붓을 얼마나 세워 쥐는가 -->
                <div class="control-label">붓 세운 정도</div>
                <div class="control-hint">왼쪽은 눕힌 붓, 오른쪽은 세운 붓</div>
                <div id="upright-slider" class="slider"></div>

                <!-- [atelier] 한쪽으로 기울인 각. 한 붓 안에서는 고정된다 -->
                <div class="control-label">붓 기울기</div>
                <div class="control-hint">한쪽으로 눕힌 각. 획 내내 유지된다</div>
                <div id="tilt-slider" class="slider"></div>

                <!-- [atelier] 물감이 붓을 따라 끌려가는 정도 -->
                <div class="control-label">물감 끌림</div>
                <div class="control-hint">오른쪽일수록 물감이 붓을 따라 늘어진다</div>
                <div id="slip-slider" class="slider"></div>

                <!-- [atelier] 붓털 밀도 -->
                <div class="control-label">붓털 밀도</div>
                <div class="control-hint">오른쪽일수록 가운데가 빽빽하다</div>
                <div id="density-slider" class="slider"></div>

                <!-- [atelier] 붓털이 얼마나 묶여 있는가 -->
                <div class="control-label">붓털 묶임</div>
                <div class="control-hint">오른쪽으로 갈수록 눌렀을 때 털이 흩어진다</div>
                <div id="gather-slider" class="slider"></div>

                <!-- [atelier] 형태를 유지하는 마디 수 -->
                <div class="control-label">붓 뻣뻣함</div>
                <div class="control-hint">왼쪽은 흐물거려 붓털 자국이 길게 끌린다</div>
                <div id="stiffness-slider" class="slider"></div>

                <div id="undo-button" class="button">되돌리기</div><div id="redo-button" class="button">다시 하기</div>
            </div>

            <!-- [atelier] 붓 커서. 원본은 캔버스 위에서 cursor:none 인데 대신 그리는 게 없었다 -->
            <svg id="brush-cursor" viewBox="-100 -100 200 200" aria-hidden="true">
                <ellipse class="ring-outer" cx="0" cy="0" rx="90" ry="90"></ellipse>
                <ellipse class="ring-inner" cx="0" cy="0" rx="90" ry="90"></ellipse>
                <circle class="dot" cx="0" cy="0" r="1.6"></circle>
            </svg>

            <div id="instructions">
                <div class="hint-item"><span>누른 채로 끌기</span> 칠하기</div>
                <div class="hint-item"><span>휠</span> 붓 크기</div>
                <div class="hint-item"><span>스페이스 + 끌기</span> 화면 이동</div>
                <div class="hint-item"><span>가장자리 끌기</span> 캔버스 크기</div>
            </div>

            <div id="footer">
                <a href="http://david.li">david.li</a> | <a href="http://github.com/dli/paint">Source code</a>
            </div>
        </script>

        <script type="text/template" id="no-support">
            <div id="no-support-container">
                <div id="error"></div>
                <div id="backlink"><a href="http://david.li">Back to david.li</a></div>
            </div>
        </script>

        <div id="placeholder"></div>


        <script src="wrappedgl.js"></script>
        <script src="utilities.js"></script>
        <script src="rectangle.js"></script>
        <script src="brush.js"></script>
        <script src="simulator.js"></script>
        <script src="colorpicker.js"></script>
        <script src="slider.js"></script>
        <script src="buttons.js"></script>
        <!--<script src="brushviewer.js"></script>-->
        <script src="paint.js"></script>

        <script>
            'use strict';

            var canvas = document.createElement('canvas');
            var wgl = WrappedGL.create(canvas);

            if (wgl !== null && wgl.hasFloatTextureSupport()) { //required features are supported
                document.body.appendChild(canvas);
                document.getElementById('placeholder').outerHTML = document.getElementById('main').innerHTML;
                var painter = new Paint(canvas, wgl);
            } else { //required features unsupported
                document.getElementById('placeholder').outerHTML = document.getElementById('no-support').innerHTML;

                if (wgl === null) {
                    document.getElementById('error').innerHTML = 'Unfortunately, your browser does not support WebGL.';
                } else {
                    document.getElementById('error').innerHTML = 'Unfortunately, your browser does not support WebGL floating point textures.';
                }
            }
        </script>

    </body>
</html>
